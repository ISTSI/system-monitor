name: ${INSPECTOR_STACK:?Use manage.py to create a private runtime}
services:
  mariadb:
    image: ${MARIADB_IMAGE:?Load the release images first}
    pull_policy: never
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: system_inspector
      MARIADB_USER: inspector_migrator
      MARIADB_PASSWORD_FILE: /run/secrets/inspector_db_migration_password
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/inspector_db_root_password
      MARIADB_ROOT_HOST: localhost
      INSPECTOR_DB_APP_USER: inspector_app
      TZ: UTC
    volumes:
      - database:/var/lib/mysql
      - ./mariadb.cnf:/etc/mysql/conf.d/inspector.cnf:ro
      - ./20-runtime-user.sh:/docker-entrypoint-initdb.d/20-runtime-user.sh:ro
      - ./db-client.sh:/opt/inspector/db-client.sh:ro
    secrets: [inspector_db_root_password, inspector_db_migration_password, inspector_db_password]
    networks: [database]
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      start_period: 30s
      interval: 5s
      timeout: 5s
      retries: 24
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 1g
  migrate:
    image: ${INSPECTOR_IMAGE:?Load the release images first}
    pull_policy: never
    restart: "no"
    user: "10001:10001"
    command: [python, -m, inspector.cli, db, upgrade, --config, /etc/system-inspector/application.yaml, --username, inspector_migrator, --password-file, /run/secrets/inspector_db_migration_password]
    depends_on:
      mariadb: {condition: service_healthy}
    volumes:
      - ./application.yaml:/etc/system-inspector/application.yaml:ro
    secrets: [inspector_db_migration_password]
    networks: [database]
    read_only: true
    tmpfs: ["/tmp:size=128m,mode=1777"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    pids_limit: 128
    mem_limit: 1g
  app:
    image: ${INSPECTOR_IMAGE:?Load the release images first}
    pull_policy: never
    restart: unless-stopped
    user: "10001:10001"
    environment:
      INSPECTOR_CONFIG_FILE: /etc/system-inspector/application.yaml
    depends_on:
      mariadb: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    volumes:
      - ./application.yaml:/etc/system-inspector/application.yaml:ro
      - ./data/state:/var/lib/system-inspector
      - ./data/cache:/var/cache/system-inspector
    secrets: [inspector_db_password]
    networks: [database, service]
    read_only: true
    tmpfs: ["/tmp:size=256m,mode=1777"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    pids_limit: 256
    mem_limit: 4g
    stop_grace_period: 60s
    healthcheck:
      test: [CMD, python, -m, inspector.cli, healthcheck]
      interval: 5s
      timeout: 8s
      retries: 24
      start_period: 15s
  proxy:
    image: ${PROXY_IMAGE:?Load the release images first}
    pull_policy: never
    restart: unless-stopped
    user: "10001:10001"
    depends_on:
      app: {condition: service_healthy}
    ports: ["${INSPECTOR_BIND_ADDRESS:-127.0.0.1}:${INSPECTOR_HTTPS_PORT:-8443}:8443"]
    volumes:
      - ./tls/server.crt:/run/tls/server.crt:ro
      - ./tls/server.key:/run/tls/server.key:ro
    networks: [service]
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    pids_limit: 64
    mem_limit: 128m
networks:
  database: {internal: true}
  service: {}
volumes:
  database: {}
secrets:
  inspector_db_root_password: {file: ./secrets/inspector_db_root_password}
  inspector_db_migration_password: {file: ./secrets/inspector_db_migration_password}
  inspector_db_password: {file: ./secrets/inspector_db_password}
